name: Fixture checks
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/test_distribution.py
      - run: python -m unittest discover -s scripts -p 'test_mlx_authoring_smoke.py' -v
      - run: python -m unittest discover -s scripts -p 'test_chapter_retcon_pilot.py' -v
      - run: cargo run --locked -p xtask -- check
      - run: cargo run --locked -p xtask -- validate-contracts
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- mcp-smoke
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- installation-smoke
        env:
          UNIVERSE_PYTHON: python
      - name: Persistent chapter and retcon regression
        run: python scripts/chapter_retcon_pilot.py --regression --output "$RUNNER_TEMP/chapter-pilot"
      - name: Owning-entity attributes and declared powers
        run: python scripts/power_authoring_pilot.py --output "$RUNNER_TEMP/power-pilot"
      - name: Authored G02 action applicability and independent audit
        run: python scripts/g02_pilot.py --output "$RUNNER_TEMP/g02-pilot"
      - name: Effective object retrieval and independent wire audit
        run: |
          cargo build --locked -p universe-store --example seed_effective_object_conflict
          python scripts/effective_object_pilot.py --output "$RUNNER_TEMP/effective-object.json"
          python scripts/audit_effective_object.py "$RUNNER_TEMP/effective-object.json"
          python scripts/test_effective_object_audit.py --evidence "$RUNNER_TEMP/effective-object.json" -v
      - name: Incremental factual authoring and independent canonical audit
        run: |
          python scripts/incremental_authoring_pilot.py --output "$RUNNER_TEMP/incremental-authoring.json"
          python scripts/audit_incremental_authoring.py "$RUNNER_TEMP/incremental-authoring.json"
          python scripts/test_incremental_authoring_audit.py --evidence "$RUNNER_TEMP/incremental-authoring.json" -v
      - run: python scripts/verify_launcher.py --bin-dir target/debug
      - name: Native and host gates
        run: echo 'Native GUI, VoiceOver, clean-machine, and LM Studio checks require separate evidence; not run by this job.'
