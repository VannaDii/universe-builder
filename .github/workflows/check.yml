name: Fixture checks
on: [push, pull_request]
jobs:
  dart-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter and bundled Dart
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/build_schema.dart
      - run: dart run tool/embed_schema.dart
      - run: git diff --exit-code -- packages/ub_store/lib/src/schema.g.dart packages/ub_store/lib/src/credential_schema.g.dart packages/ub_store/lib/src/installation_schema.g.dart
      - run: dart format --output=none --set-exit-if-changed packages tool
      - run: dart analyze packages tool
      - run: |
          umask 077
          dart test
        working-directory: packages/ub_domain
      - run: |
          umask 077
          dart test
        working-directory: packages/ub_store
      - run: |
          umask 077
          dart test
        working-directory: packages/ub_rules
      - run: |
          umask 077
          dart test
        working-directory: packages/ub_contracts
      - run: |
          umask 077
          dart test
        working-directory: packages/ub_service
      - run: dart analyze tool test/distribution_test.dart
        working-directory: apps/ub_cli
      - run: |
          umask 077
          dart test test/distribution_test.dart
        working-directory: apps/ub_cli
      - name: Assemble standalone Linux helpers
        run: dart run apps/ub_cli/tool/package_headless.dart --output target/headless/linux
      - name: Exercise standalone Linux CLI and engine
        working-directory: apps/ub_cli
        env:
          UB_TEST_BIN_DIR: ${{ github.workspace }}/target/headless/linux/bin
        run: |
          umask 077
          dart test test/universe_cli_test.dart --name 'standalone universe command'
      - name: Exercise standalone Linux MCP
        working-directory: apps/ub_mcp
        env:
          UB_TEST_BIN_DIR: ${{ github.workspace }}/target/headless/linux/bin
        run: |
          umask 077
          dart test test/mcp_cli_test.dart --name 'stdio reaches real service'
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python -m unittest discover -s scripts -p 'test_mcp_smoke.py' -v
      - run: python -m unittest discover -s scripts -p 'test_mlx_authoring_smoke.py' -v
      - run: python -m unittest discover -s scripts -p 'test_author_session.py' -v
      - run: python -m unittest discover -s scripts -p 'test_chapter_retcon_pilot.py' -v
      - run: cargo run --locked -p xtask -- check
      - run: cargo run --locked -p xtask -- validate-contracts
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- mcp-smoke
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- installation-smoke
        env:
          UNIVERSE_PYTHON: python
      - name: Current pilot contract regressions without reports
        run: python -m unittest discover -s scripts -p 'test_pilot_contracts.py' -v
      - run: python scripts/verify_launcher.py --bin-dir target/debug
      - name: Native and host gates
        run: echo 'Native GUI, VoiceOver, clean-machine, and LM Studio checks are not run by this job.'
