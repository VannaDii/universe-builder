name: Fixture checks
on: [push, pull_request]
jobs:
  dart-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.4'
      - run: dart pub get --enforce-lockfile
      - run: dart run tool/embed_schema.dart
      - run: git diff --exit-code -- packages/ub_store/lib/src/schema.g.dart
      - run: dart format --output=none --set-exit-if-changed packages tool
      - run: dart analyze packages tool
      - run: dart test
        working-directory: packages/ub_domain
      - run: dart test
        working-directory: packages/ub_store
      - run: dart test
        working-directory: packages/ub_rules
      - run: dart test
        working-directory: packages/ub_contracts
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/test_distribution.py
      - run: python -m unittest discover -s scripts -p 'test_mcp_smoke.py' -v
      - run: python -m unittest discover -s scripts -p 'test_mlx_authoring_smoke.py' -v
      - run: python -m unittest discover -s scripts -p 'test_author_session.py' -v
      - run: python -m unittest discover -s scripts -p 'test_chapter_retcon_pilot.py' -v
      - run: cargo run --locked -p xtask -- check
      - run: cargo run --locked -p xtask -- validate-contracts
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- mcp-smoke
        env:
          UNIVERSE_PYTHON: python
      - run: cargo run --locked -p xtask -- installation-smoke
        env:
          UNIVERSE_PYTHON: python
      - name: Current pilot contract regressions without reports
        run: python -m unittest discover -s scripts -p 'test_pilot_contracts.py' -v
      - run: python scripts/verify_launcher.py --bin-dir target/debug
      - name: Native and host gates
        run: echo 'Native GUI, VoiceOver, clean-machine, and LM Studio checks are not run by this job.'
