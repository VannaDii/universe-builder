name: Versioned macOS preview

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter and bundled Dart
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Validate tag and architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          APP_VERSION="$(sed -n 's/^version: \([^+]*\).*$/\1/p' apps/ub_app/pubspec.yaml)"
          test "$RELEASE_TAG" = "v$APP_VERSION"
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - run: dart run tool/build_contracts.dart --check
      - run: dart run tool/build_schema.dart --check
      - run: dart run tool/embed_schema.dart
      - run: dart run tool/embed_mcp.dart
      - run: git diff --exit-code
      - run: dart analyze packages apps/ub_cli apps/ub_engine apps/ub_mcp tool
      - run: flutter analyze apps/ub_app --no-pub
      - name: Run Dart functional tests
        run: |
          umask 077
          for package in ub_domain ub_store ub_rules ub_contracts ub_service ub_client; do
            (cd "packages/$package" && dart test)
          done
          for app in ub_cli ub_engine ub_mcp; do
            (cd "apps/$app" && dart test)
          done
      - run: dart run apps/ub_cli/tool/package_macos.dart --mode release
      - name: Create versioned archive
        run: dart run apps/ub_cli/tool/distribution.dart archive --bundle 'apps/ub_app/build/macos/Build/Products/Release/Universe Builder.app' --tag "$RELEASE_TAG" --output dist
      - name: Verify Homebrew installation and the sealed installed bundle
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new local/multiverse-release-test
          dart run apps/ub_cli/tool/distribution.dart formula --assets dist --version "${RELEASE_TAG#v}" --local \
            --output "$(brew --repository local/multiverse-release-test)/Formula/multiverse-mcp.rb"
          brew install local/multiverse-release-test/multiverse-mcp
          brew test local/multiverse-release-test/multiverse-mcp
          echo "UB_TEST_MACOS_BUNDLE=$(brew --prefix local/multiverse-release-test/multiverse-mcp)/libexec/Universe Builder.app" >> "$GITHUB_ENV"
      - name: Exercise installed CLI and engine without developer tools on PATH
        working-directory: apps/ub_cli
        run: |
          umask 077
          dart test test/universe_cli_test.dart --name 'standalone universe command'
      - name: Exercise installed MCP launcher with current permissions
        working-directory: apps/ub_mcp
        run: |
          umask 077
          dart test test/mcp_cli_test.dart --name 'stdio reaches real service'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.architecture }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter and bundled Dart
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Install Linux credential bridge build dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsecret-1-dev pkg-config
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate formula from the actual release archives
        run: dart run apps/ub_cli/tool/distribution.dart formula --assets dist --version "${RELEASE_TAG#v}" --repository "$GH_REPO" --output dist/multiverse-mcp.rb
      - name: Create draft preview for review
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --prerelease \
            --title "Universe Builder $RELEASE_TAG (preview)" \
            --notes-file packaging/preview-release-notes.md
