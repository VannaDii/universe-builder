[workspace]
resolver = "2"
members = [
    "crates/universe-domain",
    "crates/universe-schema",
    "crates/universe-rules",
    "crates/universe-store",
    "crates/universe-service",
    "crates/universe-protocol",
    "crates/universe-client",
    "crates/universe-ui",
    "crates/universe-mcp",
    "crates/universe-cli",
    "crates/universe-engine",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"

[workspace.dependencies]
universe-domain = { path = "crates/universe-domain" }
universe-schema = { path = "crates/universe-schema" }
universe-rules = { path = "crates/universe-rules" }
universe-store = { path = "crates/universe-store" }
universe-service = { path = "crates/universe-service" }
universe-protocol = { path = "crates/universe-protocol" }
universe-client = { path = "crates/universe-client" }
universe-ui = { path = "crates/universe-ui" }

# Pinned dependency set (see docs/adr/ADR-0002-stack.md).
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = [
    "preserve_order",
    "arbitrary_precision",
] }
thiserror = { version = "=2.0.16" }
# =0.10.9 (not 0.10.8): dioxus-router-macro 0.7.9 requires sha2 ^0.10.9.
sha2 = { version = "=0.10.9" }
hex = { version = "=0.4.3" }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rand = { version = "=0.9.2" }
dirs = { version = "=6.0.0" }
chrono = { version = "=0.4.42", default-features = false, features = ["clock"] }
unicode-casefold = "=0.2.0"
unicode-normalization = { version = "=0.1.22" }
tracing = { version = "=0.1.41" }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
anyhow = { version = "=1.0.100" }
tokio = { version = "=1.48.0", features = ["full"] }
tokio-util = { version = "=0.7.16", features = ["io", "codec", "rt"] }
futures = { version = "=0.3.31" }
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
schemars = { version = "=1.2.1", features = ["derive"] }
rmcp = { version = "=3.4.0", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
clap = { version = "=4.5.51", features = ["derive"] }
dioxus = { version = "=0.7.9", features = ["desktop", "router"] }
dioxus-hooks = "=0.7.9"
dioxus-signals = "=0.7.9"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
